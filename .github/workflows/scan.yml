name: MTF signal scan

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub free tier throttles this to ~1-3h)
  workflow_dispatch:
    inputs:
      demo:
        description: "Send a SAMPLE BUY alert (preview only)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt yfinance pandas numpy requests
      - run: python scan.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEMO: ${{ inputs.demo }}
